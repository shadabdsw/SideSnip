<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SideSnip: clipboard access</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --card: #ffffff;
    --fg: #1d1d1f;
    --muted: #6e6e73;
    --edge: rgba(0, 0, 0, 0.08);
    --accent: #0a84ff;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1c1c1e; --card: #2c2c2e; --fg: #f5f5f7; --muted: #a1a1a6; --edge: rgba(255, 255, 255, 0.1); }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 16px;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  }
  .card { width: 100%; max-width: 400px; padding: 20px; border-radius: 16px; background: var(--card); border: 1px solid var(--edge); }
  h1 { margin: 0 0 8px; font-size: 16px; display: flex; align-items: center; gap: 8px; }
  h1 img { width: 22px; height: 22px; }
  p { margin: 0 0 16px; color: var(--muted); }
  .actions { display: flex; justify-content: flex-end; gap: 8px; }
  button { font: inherit; font-weight: 600; height: 34px; padding: 0 16px; border-radius: 9px; border: 0; cursor: pointer; }
  #cancel { background: transparent; color: var(--muted); }
  #cancel:hover { color: var(--fg); }
  #allow { background: var(--accent); color: #fff; }
  #allow:hover { filter: brightness(1.08); }
</style>
</head>
<body>
  <div class="card">
    <h1><img src="icons/icon48.png" alt="">Allow clipboard access?</h1>
    <p>“Add copied text” needs to read what you’ve copied. SideSnip only reads it when you click that button, and nothing leaves your computer.</p>
    <div class="actions">
      <button id="cancel" type="button">Not now</button>
      <button id="allow" type="button">Allow</button>
    </div>
  </div>
  <script src="grant.js"></script>
</body>
</html>
